<script>
/* 開頭與結局：原文逐字保留（只標註說話的角色，文字不更動）
   格式：「角色|台詞」，沒有標註的就是旁白。 ph=品毫 gh=耕卉 hx=郝翔 */
const OPENING=`飛機穿過厚厚的雲層，機身微微晃動了一下。
品毫坐在靠窗的位置，看著窗外一片白茫茫的天空，臉上露出幸福的笑容。
這趟旅行，是他和女朋友耕卉期待已久的蜜月旅行。
目的地——史瓦帝尼。
為了這次旅行，他們特地找了一間號稱「什麼都可以幫你安排」的旅行社。
旅行社名字叫做——
「貪險活寶旅行社」
而負責接待他們的導遊，就是郝翔。
說起郝翔，品毫其實有點不太放心。
因為郝翔在旅行社裡有一個非常響亮的外號。
大家私底下都叫他：
「郝翔要你的錢。」
據說只要是郝翔能收費的東西，他就絕對不會放過。
「機場接送要收費。」
「幫你拿行李要收費。」
「幫你拍照也要收費。」
甚至連「幫忙問路」都有一個奇怪的服務費。
品毫曾經問過他：
ph|「你們旅行社不是已經收旅費了嗎？」
郝翔只是推了推眼鏡。
hx|「旅費是旅費。」
ph|「那這個呢？」
hx|「這是我。」
ph|「……」
品毫第一次知道，原來一個人可以把「愛錢」活成一種職業。
不過今天是蜜月旅行，品毫決定先不管這些。
他轉頭看向旁邊的耕卉。
耕卉正開心地喝著一杯飲料。
她從小就非常喜歡喝飲料和吃甜點。
只要看到飲料店，她就會停下來。
只要看到甜點店，她就會說「吃一下嘛」。
有時候明明才吃完早餐不到半小時，她還是可以問：
gh|「前面那間蛋糕店要不要去看看？」
而品毫則完全不同。
他最大的興趣是釣魚。
只要有水，他就想釣魚。
河邊可以。
湖邊可以。
海邊可以。
如果把他丟進一個沒有魚的游泳池，他可能還是會先問：
ph|「這裡有沒有魚？」
除此之外，他還有一個相當特殊的習慣。
那就是——
他非常容易肚子痛。
非常容易。
走五分鐘想上廁所。
喝一口水想上廁所。
坐十分鐘想上廁所。
甚至有時候什麼都沒做，也會突然覺得肚子怪怪的。
因此朋友們都曾經問過他：
「你是不是膀胱有自己的想法？」
而品毫總是很認真地回答：
ph|「不是。」
ph|「是我的腸子比較有主見。」
就在這時，品毫突然伸手摸了一下自己的肚子。
「……」
臉上的笑容瞬間消失。
耕卉注意到了他的表情。
gh|「怎麼了？」
ph|「沒事。」
gh|「真的？」
ph|「真的。」
停頓兩秒。
品毫又補了一句：
ph|「只是……肚子突然有一點想念廁所。」
耕卉看了他一眼。
gh|「你才剛上飛機欸。」
ph|「我知道。」
gh|「我們剛離開台灣沒多久。」
ph|「我知道。」
gh|「你不會又要……」
ph|「沒有沒有。」
品毫趕緊搖頭。
ph|「今天是蜜月。」
ph|「我要給妳一個美好的回憶。」
耕卉點點頭。
gh|「很好。」
品毫鬆了一口氣。
他伸手拿出藏在包包裡的禮物。
ph|「對了，這個給妳。」
耕卉愣了一下。
gh|「什麼？」
ph|「蜜月禮物。」
品毫把包裝慢慢拆開。
裡面是一隻可愛的史迪奇娃娃。
耕卉立刻露出笑容。
gh|「史迪奇！」
她開心地把娃娃抱到懷裡。
gh|「你什麼時候買的？」
ph|「偷偷買的啊。」
gh|「很好看欸。」
ph|「我就知道妳會喜歡。」
品毫也露出了得意的笑容。
就在這一瞬間——
一陣更加強烈的腹痛突然襲來。

function nz(d=.3,v=.3,f=1000,q=1,w=0){const a=ac();if(!a||!snd)return;const t=a.currentTime+w,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t)}
const click=()=>{nz(.025,.4,3200,2);navigator.vibrate&&navigator.vibrate(4)};
const ding=()=>{tone(880,.25,'sine',.2);tone(1320,.35,'sine',.15,.12)};
const coin=()=>{tone(1200,.08,'square',.08);tone(1800,.2,'square',.08,.08)};
const steps=()=>{for(let i=0;i<3;i++)nz(.07,.18,600,.8,i*.22)};
const growl=()=>{const a=ac();if(!a||!snd)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(90,t);o.frequency.linearRampToValueAtTime(55,t+.7);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.8);o.connect(g);g.connect(master);o.start(t);o.stop(t+.85)};
const toot=()=>{const a=ac();if(!a||!snd)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type='square';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(60,t+.45);const l=a.createOscillator(),lg=a.createGain();l.frequency.value=28;lg.gain.value=25;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(master);o.start(t);l.start(t);o.stop(t+.55);l.stop(t+.55)};
function ambient(kind){const a=ac();if(!a)return;if(!amb){const n=a.createBuffer(1,a.sampleRate*2,a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=n;s.loop=true;amb={f:a.createBiquadFilter(),g:a.createGain()};amb.f.type='lowpass';s.connect(amb.f);amb.f.connect(amb.g);amb.g.connect(master);amb.g.gain.value=0;s.start()}

  {r:[364,198,72,96],l:'黑色的門',a:blackDoor},
  ...(S.f.ch3?[{r:[470,96,150,60],l:'牆上的字',a:()=>{note('wall3','走廊牆上的字','Lubombo · Hhohho · Shiselweni · Manzini（旁邊寫著：109）');msg('牆上寫著四個地名：Lubombo、Hhohho、Shiselweni、Manzini。旁邊用小字寫著「109」。')}}]:[]),

 if(!S.f.dark){await say(script(S2.blackdoor));S.f.dark=1;note('door3','黑色的門','一、客人的入住證明　二、旅行社的秘密章　三、你真正想隱藏的東西');render();return msg('（燈全熄了。好黑……身上有可以照明的東西嗎？）')}

<script>
/* ================= 第三章：阿諾・「屎」瓦辛格 ================= */
async function ch3Start(){await say(script(S3.truth));
 while(true){const r=await choose('（品毫要怎麼回答？）',['「好啦，付五百。」','「我不玩了！」','「打個折，兩百五？」']);
  if(r===1)break;
  if(r===0){await say([['gh','「你瘋了嗎？那是蜜月基金欸！」','gh-roll']]);oops('耕卉搶走了你的錢包。再想一次。');continue}
  await say([['hx','「蜜月優惠打九折，四百五。」','hx-money'],['ph','「……」']]);oops('越殺越貴。再想一次。')}
 await say(script(S3.deal));note('ch3','最後一關','房間彼此相連、牆上藏著密碼、古老的照片裡藏著數字、旅館地圖缺了一大片、史迪奇娃娃藏著秘密。');msg('（大廳的燈變成了紫色。去找地圖缺掉的碎片吧。）');save(1)}

function photosPanel(){note('photos','大廳的三張舊照片','2019 年：Hlane 國家公園的犀牛。2008 年：蘆葦舞節的蘆葦束。2015 年：Ngwenya 的玻璃鱷魚。（101 號房：照年份從舊到新，數一數）');
 const ph=(y,cap,draw)=>`<div style="background:#e8dcc0;border:6px solid #5a3a20;padding:4px;border-radius:4px"><svg viewBox="0 0 160 110" style="width:100%">${draw}</svg><div style="color:#5a3a20;font-weight:900;font-size:13px">${y}<br><small>${cap}</small></div></div>`;
 const rh=`<rect width="160" height="110" fill="#e8d090"/>`+[30,80,130].map(x=>`<text x="${x}" y="70" font-size="34" text-anchor="middle">🦏</text>`).join('');
 const reed=`<rect width="160" height="110" fill="#bfe6a0"/>`+[20,50,80,110,140].map(x=>`<path d="M${x} 100V25" stroke="#8a6a2a" stroke-width="7"/><path d="M${x-8} 30q8-14 16 0" fill="#c9a050"/>`).join('');
 const gl=`<rect width="160" height="110" fill="#d8f4ee"/>`+[50,110].map(x=>`<text x="${x}" y="70" font-size="34" text-anchor="middle">🐊</text>`).join('');
 return panel('三張舊照片',`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${ph('2019','Hlane 國家公園',rh)}${ph('2008','蘆葦舞節 Umhlanga',reed)}${ph('2015','Ngwenya 玻璃工廠',gl)}</div><p class="pd">照片下面的銅牌：「把它們放回該有的順序。」</p>`)}
async function hxQuiz(){if(has('pieceC')||S.f.mapDone)return say([['hx',['「地圖碎片要照地圖上的編號放喔。」','「提示 E500，童叟無欺。」'][Math.random()*2|0]]]);
 await say([['hx','「最後一片地圖碎片在我這裡。」','hx-money'],['hx','「想要？E500。」'],['hx','「……或者，答對我的史瓦帝尼小考，免費。」']]);
 const Q=[['國王的稱號 Ngwenyama，意思是？',['鱷魚','獅子','大象'],1],['史瓦帝尼的國際電話區碼是？',['+27','+886','+268'],2],['史瓦帝尼比台灣慢幾個小時？',['2 小時','6 小時','8 小時'],1]];
 const ok=await panel('郝翔的史瓦帝尼小考',`${Q.map(([q,o],i)=>`<div style="text-align:left;margin:8px 0"><b>${i+1}. ${q}</b><div class="row" style="justify-content:flex-start">${o.map((x,j)=>`<button data-q="${i}" data-j="${j}">${x}</button>`).join('')}</div></div>`).join('')}<button class="btn-y" id="sub">交卷</button>`,(el,done)=>{const v=[-1,-1,-1];
  el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{v[+b.dataset.q]=+b.dataset.j;el.querySelectorAll(`[data-q="${b.dataset.q}"]`).forEach(x=>x.style.borderColor=x===b?'#ffd23f':'');click()});
  el.querySelector('#sub').onclick=()=>{if(v.every((x,i)=>x===Q[i][2])){ding();done(true)}else oops('郝翔：「有錯喔。改考卷費 E10。」')}});
 if(!ok)return;get('pieceC');await say([['hx','「……全對。」'],['hx','「拿去吧。真不想給你。」']])}
async function ghCh3(){await say([['gh',['「找到了沒？」','「你今天好像特別認真。」','「史迪奇好像怪怪的，背後鼓鼓的。」','「我想吃甜點。」'][Math.random()*4|0]]])}
async function mapPuzzle(){if(S.f.map)return doc('map3','完整的旅館地圖','地圖補齊了。104 到 107 那一塊，畫著好幾間互相連通的房間，每一扇門都塗了顏色。<br>角落寫著：<b>「照國旗由上而下的顏色，穿過相連的房間。」</b>','完整的旅館地圖：104 到 107 是互相連通的房間，門都塗了顏色。「照國旗由上而下的顏色，穿過相連的房間。」');
 const n=['pieceA','pieceB','pieceC'].filter(has).length;if(n<3)return msg(`旅館地圖缺了一大片。你手上只有 ${n} 片碎片。`);
 const ok=await orderTap('把碎片放回旅館地圖',`<p class="pd">地圖上缺了三個洞，旁邊寫著 ①、②、③。<br>碎片背面各寫著一個史瓦帝尼的地名。</p>`,['🧩 Lubombo','🧩 Hhohho','🧩 Manzini'],[1,2,0],'碎片卡不進去。順序不對。',3);
 if(!ok)return;S.f.map=1;S.f.mapDone=1;take('pieceA');take('pieceB');take('pieceC');render();await mapPuzzle()}
function flagMaze(){const ANS=['藍','黃','紅','黃','藍'],C={藍:'#3e5eb9',黃:'#ffd900',紅:'#b10c0c'};
 return panel('相連的房間',`<p class="pd" id="fm"></p><div class="row" id="fd"></div><p class="pd" id="fp"></p>`,(el,done)=>{let k=0;
 const draw=()=>{const opts=['藍','黃','紅'].sort(()=>Math.random()-.5);el.querySelector('#fm').innerHTML=`第 ${k+1} 間房間。眼前有三扇門。`;el.querySelector('#fp').textContent='走過的門：'+ANS.slice(0,k).join(' → ');
  el.querySelector('#fd').innerHTML=opts.map(c=>`<button data-c="${c}" style="width:80px;height:120px;background:${C[c]};border:4px solid #3a2a22;border-radius:40px 40px 6px 6px;color:${c==='黃'?'#3a2200':'#fff'};font-weight:900">${c}</button>`).join('');
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{if(b.dataset.c===ANS[k]){click();if(++k===ANS.length){ding();await sl(400);done(true)}else draw()}else{k=0;oops('門後是一面牆。品毫撞了一下，又回到了第一間房間。');draw()}})};draw()})}
async function finalDoor(){
 if(!S.f.map)return msg('黑色的門前面，房間彼此相連，像一座迷宮。旅館地圖缺了一大片，走進去一定會迷路。');
 if(!S.f.maze){if(!await flagMaze())return;S.f.maze=1;await say('品毫穿過最後一扇藍色的門。黑色的門，就在眼前。')}
 if(!S.f.stitch){await say([['gh','「品毫，你看。史迪奇的背後，好像縫了什麼東西。」']]);await say(script(S3.stitch));S.f.stitch=1;note('stitch','史迪奇背後的紙條','「真正的出口，永遠就在你最想去的地方。」');save(1)}
 if(!has('note3')){if(!await notePanel())return;get('note3')}
 if(await devicePanel()){take('cert');take('stamp');take('note3');await ending()}}
const TILES=['想','愛','上','我','出','妳','所','只','口','是','找','廁'];
function notePanel(){return panel('第三樣東西',`<p class="pd">裝置的第三個格子寫著：「<b>你真正想隱藏的東西</b>」。<br>旁邊放著一支筆和一張空白的紙條。品毫要寫什麼？</p><div class="slot" id="sl"></div><div class="tiles">${TILES.map((c,i)=>`<button data-i="${i}">${c}</button>`).join('')}</div><div class="row"><button id="bk">⌫ 擦掉</button><button class="btn-y" id="ok">寫好了</button></div>`,(el,done)=>{let seq=[];const sl=el.querySelector('#sl');
 const draw=()=>{sl.textContent=seq.map(i=>TILES[i]).join('');el.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('on',seq.includes(+b.dataset.i)))};
 el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(seq.includes(i))return;seq.push(i);click();draw()});
 el.querySelector('#bk').onclick=()=>{seq.pop();draw()};
 el.querySelector('#ok').onclick=()=>{const s=seq.map(i=>TILES[i]).join('');if(s==='我只是想上廁所')return done(true);
  oops(s.includes('愛')?'紙條被彈了回來。裝置說：「這是你真正想說的，不是你想『隱藏』的。」':'裝置發出「嗶——」的一聲。這不是你真正想隱藏的東西。');seq=[];draw()};draw()})}
function devicePanel(){const items=[['note3','品毫寫的紙條'],['cert','入住證明'],['stamp','旅行社秘密章']];
 return panel('黑色的門・裝置',`<p class="pd">門旁的裝置上有三個格子。要照什麼順序放進去？</p><div class="pick" style="grid-template-columns:repeat(3,1fr)">${items.map(([k,n],i)=>`<button data-i="${i}" style="text-align:center"><div style="width:50px;margin:auto">${icon(IT[k].i)}</div>${n}</button>`).join('')}</div><button id="rs">重新放</button>`,(el,done)=>{let seq=[];const bs=[...el.querySelectorAll('[data-i]')],ans=[1,2,0];
 const draw=()=>bs.forEach((b,i)=>{b.querySelector('sup')?.remove();const k=seq.indexOf(i);b.style.borderColor=k>=0?'#ffd23f':'';if(k>=0)b.insertAdjacentHTML('beforeend',`<sup style="color:#ffd23f"> ${k+1}</sup>`)});
 bs.forEach((b,i)=>b.onclick=async()=>{if(seq.includes(i))return;seq.push(i);click();draw();if(seq.length===3){if(seq.join()===ans.join()){ding();await sl(500);done(true)}else{seq=[];draw();oops('裝置把東西全吐了出來。順序不對。')}}});
 el.querySelector('#rs').onclick=()=>{seq=[];draw()}})}
</script>

<script>
/* ================= 通用鎖 ================= */
function shakeEl(e){if(!e)return;e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}
function keypad(title,desc,n,ans,wrong){return panel(title,`${desc}<div class="kpd"><div class="kdisp">${'<i></i>'.repeat(n)}</div><div class="kgrid">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div></div>`,(el,done)=>{let v='';
 const d=()=>el.querySelectorAll('.kdisp i').forEach((x,i)=>x.textContent=v[i]||'');
 el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='⌫'){v=v.slice(0,-1);click()}else if(k==='✓'){if(v===ans){ding();setTimeout(()=>done(true),500);return}v='';shakeEl(el.querySelector('.kpd'));oops(wrong)}else if(v.length<n){v+=k;tone(600+ +k*40,.08,'square',.05)}d()});d()})}
function dialLock(title,desc,wheels,ans){return panel(title,`${desc}<div class="padlock"><div class="shackle"></div><div class="lbody"><div class="wheels">${wheels.map(()=>`<div class="wh"><button class="up">▲</button><div class="wv"></div><button class="dn">▼</button></div>`).join('')}</div></div></div><button class="btn-y" id="pull">拉開</button>`,(el,done)=>{
 const v=wheels.map(()=>0),L=i=>wheels[i].length;
 const draw=()=>el.querySelectorAll('.wh').forEach((w,i)=>{const W=wheels[i];w.querySelector('.wv').innerHTML=`<span>${W[(v[i]+L(i)-1)%L(i)]}</span><b>${W[v[i]]}</b><span>${W[(v[i]+1)%L(i)]}</span>`});
 el.querySelectorAll('.wh').forEach((w,i)=>{w.querySelector('.up').onclick=()=>{v[i]=(v[i]+L(i)-1)%L(i);click();draw()};w.querySelector('.dn').onclick=()=>{v[i]=(v[i]+1)%L(i);click();draw()}});draw();
 el.querySelector('#pull').onclick=async()=>{if(v.every((x,i)=>wheels[i][x]===ans[i])){el.querySelector('.padlock').classList.add('open');ding();await sl(700);done(true)}else{shakeEl(el.querySelector('.padlock'));oops('鎖紋風不動。')}}})}

function pickOne(title,desc,items,cols=1){return panel(title,`${desc}<div class="pick" style="grid-template-columns:repeat(${cols},1fr)">${items.map((it,i)=>`<button data-i="${i}" style="text-align:center">${it.h}</button>`).join('')}</div>`,(el,done)=>{
 el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i];click();if(it.ok){ding();setTimeout(()=>done(true),400)}else oops(it.bad||'不對喔。')})})}
function orderTap(title,desc,items,ans,wrong,cols=4){return panel(title,`${desc}<div class="pick" style="grid-template-columns:repeat(${cols},1fr)">${items.map((h,i)=>`<button data-i="${i}" style="text-align:center">${h}</button>`).join('')}</div><button id="rs">重新開始</button>`,(el,done)=>{let seq=[];const bs=[...el.querySelectorAll('[data-i]')];
 const draw=()=>bs.forEach((b,i)=>{b.querySelector('sup')?.remove();const k=seq.indexOf(i);b.style.borderColor=k>=0?'#ffd23f':'';if(k>=0)b.insertAdjacentHTML('beforeend',`<sup style="color:#ffd23f"> ${k+1}</sup>`)});
 bs.forEach((b,i)=>b.onclick=async()=>{if(seq.includes(i))return;seq.push(i);click();draw();if(seq.length===ans.length){if(seq.every((x,k)=>x===ans[k])){ding();await sl(500);done(true)}else{seq=[];draw();oops(wrong)}}});
 el.querySelector('#rs').onclick=()=>{seq=[];draw()}})}

/* ================= 檢查物品 ================= */
async function examine(k){const it=IT[k];
 if(k==='mag')return magPanel();
 if(k==='feelist')return panel(it.n,`<div class="paper" style="font-size:15px">${feeTable()}</div>`);
 if(k==='diary')return diaryPanel();
 if(k==='tphoto')return tphotoPanel();
 if(k==='receipt')return receiptPanel();
 if(k==='candle'||k==='match'){if(!(has('candle')&&has('match')))return panel(it.n,`<div style="width:110px;margin:auto">${icon(it.i)}</div><p class="pd">${it.d}</p>`);
  const r=await panel(it.n,`<div style="width:110px;margin:auto">${icon(it.i)}</div><p class="pd">${it.d}</p><button class="btn-y" id="lt">🔥 用火柴點亮蠟燭</button>`,(el,done)=>{el.querySelector('#lt').onclick=()=>done(true)});
  if(r){take('candle');take('match');get('lit');render();msg('蠟燭亮了。國旗顏色的條紋，在黑暗裡閃著小小的光。')}return}
 return panel(it.n,`<div style="width:110px;margin:auto">${icon(it.i)}</div><p class="pd">${it.d}</p>`)}

/* ================= 郝翔的提示（每次 500 元） ================= */
function hint(){const f=S.f;
 if(!f.ch2){if(!has('mag'))return'耕卉的椅背口袋裡有一本機上雜誌。要翻她的口袋，藉口得跟她最愛的東西有關——飲料、甜點。';
  if(!f.doc)return'雜誌只告訴你國王跟國家同一年出生。要知道是哪一天改名的，看看 A 座的機上娛樂。耳機在耕卉那裡。';
  return'國王跟國家同一年出生，在他 50 歲生日那天改名。我的貼紙……別信。'}
 if(!f.immig)return'入境卡：正式國名是新的那個；行政首都和最大城市不一樣；當地貨幣不是蘭特。雜誌都有寫。';
 if(!f.total)return'收費單只算打勾的，有乘號的先乘。';
 if(!f.paid)return'先用最大的鈔票，再慢慢補零頭。我不找零。';
 if(f.stop!==undefined&&!f.tourDone){const i=f.stop;return['國旗由上而下是藍、黃、紅、黃、藍，紅色最寬，盾牌是橫的。','照日期排：4 月、8 月、9 月、12 月。','舞者只跳一次：踏腳、拍手、踏腳、舉盾、跳、拍手。','數清楚陸地上的斑馬、疣豬、黑斑羚，水裡的鱷魚不算。','Ngwenya 是鱷魚，國王的稱號 Ngwenyama 是獅子。','蠟燭條紋要跟國旗一樣，由上而下：藍、黃、紅、黃、藍。','先回應 Sawubona，付錢，最後說謝謝。'][i]}
 if(!f.cert)return'蜜月套房：門牌三個數字加起來是 5。';
 if(!f.night)return'去 113 號房休息吧。';
 if(!f.dark)return'晚上，去走廊盡頭那扇黑色的門。';
 if(!has('lit')&&!f.ch3)return'太黑了。你在蠟燭店拿到了什麼？兩樣一起「檢查」。';
 if(!f.reg)return'櫃檯下面那本舊名冊。那位旅客入住的那天，也是這個國家改名的日子。';
 if(!f.diary)return'102 號房的照片有日期，103 號房的收據有捲數。照日期排好收據。';
 if(!f.stamp)return'日記說：公事包的密碼是我的外號。大家私底下都叫我什麼？';
 if(!f.r101)return'大廳的舊照片照年份從舊到新排，再數每張照片裡的東西有幾個。';
 if(!f.r109)return'走廊牆上的四個地名，對照大廳那張史瓦帝尼地圖上的編號。';
 if(!has('pieceC')&&!f.map)return'最後一片碎片在我身上。答對我的小考就送你——雜誌裡都有答案。';
 if(!f.map)return'碎片背面的地名，對照大廳史瓦帝尼地圖的編號 ①②③。';
 if(!f.maze)return'照國旗由上而下的顏色選門：藍、黃、紅、黃、藍。';
 if(!has('note3'))return'日記說：「不要讓她知道你真正想做什麼。」你今天真正想做的，一直都是同一件事。';
 return'黑色的門寫了順序：一、入住證明；二、秘密章；三、你真正想隱藏的東西。'}
/* ================= 結局 ================= */
async function ending(){S.f.done=1;await say(script(ENDING));S.on=0;ambient('none');clr();if(window.SD)SD.clear(S.rid,S.t,S.hints||0,S.borrows||0);
 $('#endh').textContent='蜜月完成！';$('#endp').innerHTML=`錢包還剩 ${S.money.toLocaleString()} 元<br>跟郝翔買了 ${S.hints} 次提示・跟耕卉借了 ${S.borrows} 次錢`;$('#endt').textContent='逃脫時間 '+fmt(S.t)+(S.t<=GOAL?'　🏆 60 分鐘內完成！':'');show('end')}

/* ================= 選單 ================= */
$('#bMenu').onclick=()=>{if(busy)return;panel('選單',`<div class="row" style="flex-direction:column"><button id="m1">💾 存檔</button><button id="m2">${snd?'🔇 關閉音效':'🔊 開啟音效'}</button><button id="m3">回到標題</button><button id="m4">回到第柒門大廳</button></div>`,(el,done)=>{
 el.querySelector('#m1').onclick=()=>{done();busy=0;save(1);toast('💾 已存檔')};
 el.querySelector('#m2').onclick=()=>{snd=!snd;ambient(snd?(SC[S.sc].amb||'hotel'):'none');done()};
 el.querySelector('#m3').onclick=()=>{done();toTitle()};el.querySelector('#m4').onclick=()=>{done();toLobby()}})};

 const me=S;if(window.SD)SD.begin().then(id=>{me.rid=id;save(1)});
 show('game');S.f.v_seat=1;render();ambient('plane');await card('第一章','史瓦帝尼的第一個秘密');
 const OP=script(OPENING),cut=OP.indexOf('就在他即將抵達廁所時——');
 await say(OP.slice(0,cut));S.sc='door';S.f.v_door=1;render();await say(OP.slice(cut));
 await say([['gh','「算了。我回座位等你，快一點喔。」'],'耕卉抱著史迪奇走回第 17 排。',['ph','（只要跟飲料、甜點有關，耕卉就什麼都不會懷疑……先看看螢幕上寫什麼。）','ph-pain']]);
 note('rule','品毫的生存法則','只要跟飲料、甜點有關，耕卉就什麼都不會懷疑。');msg('（點擊畫面上的東西來調查。上方 💡 可以花 500 元跟郝翔買提示。）');save(1)}

 S=d;S.on=1;busy=0;sel=null;tapR=null;show('game');render();ambient(SC[S.sc].amb||'hotel');msg('（已讀取存檔。品毫的肚子，還在痛。）')}
$('#bNew').onclick=()=>{ac();newGame()};$('#bCont').onclick=()=>{ac();loadGame()};$('#bDel').onclick=()=>{clr();refreshTitle()};

refreshTitle();

</script>

<!-- 第柒門：沒有註冊 / 沒有角色就送回大廳；記錄遊玩與通關時間 -->
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const LOBBY = 'https://hao-yuliu.github.io/escape-room/', SLUG = 'pupu';
const sb = createClient('https://umlnwzpmjxktfzjvcbts.supabase.co', 'sb_publishable_8J3VI8dijlCccHQbXPfCQQ_v_O0Au3w');

const { data: { session } } = await sb.auth.getSession();
const user = session?.user ?? null;
const { data: profile } = user
  ? await sb.from('profiles').select('username').eq('id', user.id).maybeSingle()
  : { data: null };

if (!user || !profile) {
  location.replace(`${LOBBY}?need=player&room=${SLUG}#rooms`);
} else {
  const { data: game } = await sb.from('games').select('id').eq('slug', SLUG).maybeSingle();
  const begin = async () => {
    if (!game) return null;
    const { data } = await sb.from('play_records').insert({ user_id: user.id, game_id: game.id }).select('id').single();
    return data?.id ?? null;
  };
  const finish = async (rid, fields) => {
    if (!game) return;
    rid = rid || await begin();
    if (rid) await sb.from('play_records').update({ ...fields, updated_at: new Date().toISOString() }).eq('id', rid);
  };
  window.SD = {
    player: profile,
    begin,
    clear: (rid, secs, hints, borrows) => finish(rid, { status: 'cleared', clear_time_sec: secs, hints, borrows }),
    fail: (rid, secs, hints, borrows) => finish(rid, { status: 'failed', clear_time_sec: null, hints, borrows }),
  };
  document.getElementById('who').textContent = `旅客：${profile.username}`;
  document.getElementById('sd-hide').remove();
}
</script>
